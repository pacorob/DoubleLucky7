<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Double Lucky 7 Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#18253b,#080d18 48%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:780px;margin:auto;padding:18px 14px 28px}.panel{background:#111a2aee;border:1px solid #ffffff0d;border-radius:22px;padding:16px;margin:11px 0;box-shadow:0 12px 32px #0005}h1{font-size:29px;margin:0}h2{margin:2px 0 10px}.muted{color:#9eabbf}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}input,button{font:inherit;border:0;border-radius:14px;padding:12px}input{width:100%;background:#eef1f6;color:#111}button{font-weight:800;background:#f4f6fb;color:#111}button.dark{background:#29364b;color:#fff}button.gold{background:#f5c542}.hidden{display:none}.players{display:grid;gap:7px}.p{padding:10px;background:#1d293c;border-radius:12px;display:flex;justify-content:space-between}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px}.score{background:#1d293c;border-radius:13px;padding:9px}.score b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score strong{font-size:23px}.pill{display:inline-block;background:#29364b;padding:5px 9px;border-radius:99px;margin:3px}.bidgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bidgrid button{background:#29364b;color:#fff}.table{min-height:160px;background:#10283a;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:14px}.pcard{width:57px;height:79px;background:#fff;color:#111;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:18px}.small{font-size:10px;font-weight:600}.hand{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-top:12px}.hand button{width:57px;height:82px;padding:2px;font-size:16px;box-shadow:0 5px 12px #0006}.hand button:active{transform:translateY(-6px)}.red{color:#d22}.notice{background:#1d293c;padding:10px;border-radius:12px;font-size:13px}
</style></head><body><main class="app">
<section class="panel"><h1>DOUBLE LUCKY 7</h1><div class="muted">Online · speel met vrienden</div></section>
<section id="home" class="panel"><h2>Spelen</h2><input id="name" placeholder="Jouw naam"><div class="row" style="margin-top:8px"><button class="gold" onclick="create()">Kamer maken</button><button class="dark" onclick="toggleJoin()">Kamer joinen</button></div><div id="join" class="hidden" style="margin-top:9px"><input id="code" placeholder="4-cijferige code" maxlength="4"><button style="margin-top:7px" onclick="join()">Join</button></div></section>
<section id="lobby" class="panel hidden"><h2>Kamer <span id="rc"></span></h2><div id="lp" class="players"></div><p class="muted">Deel deze code met je vrienden.</p><button class="gold" onclick="start()">Start spel</button></section>
<section id="game" class="hidden"><div id="info" class="panel"></div><div id="scores" class="panel"></div><div id="play" class="panel"></div></section>
</main><script>
let room="",id="",state=null,hand=[],es=null;
const $=id=>document.getElementById(id),S=["♠","♥","♦","♣"];
async function api(url,opt){let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error||"Fout");return j}
function err(e){alert(e.message)}
function toggleJoin(){$("join").classList.toggle("hidden")}
async function create(){try{room=(await api("/create")).code;await joinRoom($("name").value||"Speler")}catch(e){err(e)}}
async function join(){try{room=$("code").value.toUpperCase();await joinRoom($("name").value||"Speler")}catch(e){err(e)}}
async function joinRoom(name){let j=await api(`/join?code=${room}&name=${encodeURIComponent(name)}`);id=j.id;state=j.state;connect();render()}
function connect(){es?.close();es=new EventSource(`/events?code=${room}&id=${id}`);es.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==="state"){state=x.state;render()}if(x.type==="hand"){hand=x.hand;render()}}}
function render(){if(!state)return;$("home").classList.add("hidden");if(!state.started){$("lobby").classList.remove("hidden");$("game").classList.add("hidden");$("rc").textContent=room;$("lp").innerHTML=state.players.map(p=>`<div class=p>${p.name}<span>${p.connected?"🟢":"⚪"}</span></div>`).join("");return}$("lobby").classList.add("hidden");$("game").classList.remove("hidden");
$("info").innerHTML=`<h2>Ronde ${state.round}/14</h2><div>${state.cards} kaart${state.cards==1?"":"en"} · dealer ${state.players[state.dealer].name}</div><span class=pill>${state.trump?"Troef "+S[state.trump.s]+" "+state.trump.v:"Geen troef"}</span>${state.round===7?'<span class=pill>★ Double Lucky 7</span>':''}`;
$("scores").innerHTML='<div class=scores>'+state.players.map((p,i)=>`<div class=score><b>${p.name}</b><strong>${p.score}</strong><div class=muted>inzet ${state.bids[i]??"—"} · ${state.won[i]} slagen</div></div>`).join("")+'</div>';
let me=state.players.findIndex(p=>p.id===id),mine=me===state.turn;
if(state.finished){$("play").innerHTML="<h2>Spel afgelopen 🎉</h2>"+[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<p>${p.name}: <b>${p.score}</b></p>`).join("");return}
if(state.phase==="bid"){ $("play").innerHTML=mine?`<h2>Jouw inzet</h2><div class=bidgrid>${Array.from({length:state.cards+1},(_,i)=>`<button onclick="act('bid',${i})">${i}</button>`).join("")}</div>`:`<h2>${state.players[state.turn].name} kiest een inzet…</h2>`;return}
$("play").innerHTML=`<h2>${mine?"Jouw beurt":state.players[state.turn].name+" is aan de beurt"}</h2><div class=table>${state.trick.length?state.trick.map(x=>`<div class="pcard ${x.c.s===1||x.c.s===2?'red':''}">${x.c.joker?"★":S[x.c.s]+" "+x.c.v}<span class=small>${state.players[x.p].name}</span></div>`).join(""):"<span class=muted>Nieuwe slag</span>"}</div>${mine?`<div class=hand>${hand.map((c,i)=>`<button class="${c.s===1||c.s===2?'red':''}" onclick="act('play',${i})">${c.joker?"★":S[c.s]+" "+c.v}</button>`).join("")}</div>`:"<div class=notice>Wacht tot je aan de beurt bent…</div>"}`;
}
async function act(a,v){try{await api("/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:room,id,action:a,...a==="bid"?{value:v}:{index:v}})})}catch(e){err(e)}}
async function start(){try{await api("/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:room,id})})}catch(e){err(e)}}
</script></body></html>
